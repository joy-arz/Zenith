name: Zenith release

on:
  push:
    tags: ['launcher@*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Launcher version, for example 0.3.1 (must be newer than the installed release)'
        required: true
        type: string
      recovery_run:
        description: Reuse all five successful build artifacts from this Zenith release run ID
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: fork-release-${{ inputs.version && format('launcher@{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'joy-arz/Zenith'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RECOVERY_RUN: ${{ inputs.recovery_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#launcher@}}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          tag="launcher@$version"
          refs=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" "refs/tags/$tag^{}")
          [[ -n "$refs" ]] || {
            echo "::error::Push $tag at $GITHUB_SHA before releasing. The release runner cannot create the tag."
            exit 1
          }
          tagged_sha=$(printf '%s\n' "$refs" | tail -1 | cut -f1)
          if [[ -n "$RECOVERY_RUN" ]]; then
            [[ "$RECOVERY_RUN" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN" |
              jq -e --arg sha "$tagged_sha" --arg repo "$GITHUB_REPOSITORY" '
                .path == ".github/workflows/fork-release.yml" and .head_sha == $sha
                and .head_repository.full_name == $repo and .status == "completed"
              ' >/dev/null
            gh run view "$RECOVERY_RUN" --repo "$GITHUB_REPOSITORY" --json jobs |
              jq -e '
                any(.jobs[]; .name == "version" and .conclusion == "success")
                and ([.jobs[] | select(.name | startswith("build ("))] |
                  length == 5 and all(.conclusion == "success"))
              ' >/dev/null
          else
            [[ "$tagged_sha" == "$GITHUB_SHA" ]] || { echo 'Version tag already points to another commit; choose a new version.' >&2; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=launcher@$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: ${{ !inputs.recovery_run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            asset: zenith-launcher-linux-x86_64.tar.gz
          - os: windows-latest
            platform: windows-x64
            asset: zenith-launcher-windows-x64.zip
            setup: zenith-launcher-setup.exe
          - os: windows-11-vs2026-arm
            platform: windows-arm64
            asset: zenith-launcher-windows-arm64.zip
            setup: zenith-launcher-setup-arm64.exe
          - os: macos-15-intel
            target: aarch64-apple-darwin
            platform: macos-arm64
            arch: arm64
            asset: zenith-launcher-macos-arm64.zip
          - os: macos-15-intel
            platform: macos-x64
            arch: x64
            asset: zenith-launcher-macos-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HORIZON_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      HORIZON_LAUNCHER_TAG: ${{ needs.version.outputs.tag }}
      BUILD_TARGET: ${{ matrix.target }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows-') && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add "$BUILD_TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: fork-launcher-${{ matrix.target != '' && 'macos-x64' || matrix.platform }}
          cache-on-failure: true
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
      - name: Use runtime shaders on macOS
        if: runner.os == 'macOS'
        run: echo 'LAUNCHER_FEATURES=gpui_platform/runtime_shaders' >> "$GITHUB_ENV"
      - name: Validate launcher
        run: |
          cargo fmt --manifest-path launcher/Cargo.toml --check
          cargo test --locked --manifest-path launcher/Cargo.toml ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"} -- --test-threads=1
      - name: Check target-specific tests
        if: matrix.target != ''
        run: cargo check --locked --all-targets --manifest-path launcher/Cargo.toml --target "$BUILD_TARGET" ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"}
      - name: Build launcher
        run: cargo build --release --locked --manifest-path launcher/Cargo.toml ${BUILD_TARGET:+--target "$BUILD_TARGET"} ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"}
      - name: Smoke test offline profile and PNG upload
        env:
          HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
          HORIZON_NO_AUDIO: '1'
          HORIZON_NO_KEYCHAIN: '1'
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          export HORIZON_LAUNCHER_HOME="$RUNNER_TEMP/fork-smoke/launcher"
          export HORIZON_HOME="$RUNNER_TEMP/fork-smoke/game"
          export XDG_DATA_HOME="$RUNNER_TEMP/fork-smoke/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/fork-smoke/config"
          export HORIZON_LAUNCHER_TRASH="$RUNNER_TEMP/fork-smoke/trash"
          export HORIZON_LAUNCHER_CLIPBOARD="$RUNNER_TEMP/fork-smoke/clipboard"
          export HORIZON_LAUNCHER_DESKTOP="$RUNNER_TEMP/fork-smoke/desktop"
          binary=launcher/target/release/horizon-launcher
          [[ -z "$BUILD_TARGET" ]] || binary=launcher/target/debug/horizon-launcher
          [[ "$RUNNER_OS" != Windows ]] || binary="$binary.exe"
          [[ "$("$binary" --version)" == "horizon-launcher $EXPECTED_VERSION" ]]
          python3 - <<'PYCODE'
          import os, pathlib, struct, zlib
          def chunk(kind, body):
              return struct.pack('>I', len(body)) + kind + body + struct.pack('>I', zlib.crc32(kind + body))
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 64, 64, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress((b'\x00' + b'\x20\x80\xc0\xff' * 64) * 64)) + chunk(b'IEND', b'')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'fork-skin.png').write_bytes(png)
          PYCODE
          "$binary" account offline Builder_1
          "$binary" account skin Builder_1 "$RUNNER_TEMP/fork-skin.png" --model slim
          "$binary" --json account list > "$RUNNER_TEMP/fork-profile.json"
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert any(n["name"] == "Builder_1" and n["selected"] for n in p["offline"])' "$RUNNER_TEMP/fork-profile.json"
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          tar -czf "out/zenith-launcher-linux-x86_64.tar.gz" -C launcher/target/release horizon-launcher
      - name: Package Windows
        if: runner.os == 'Windows'
        env:
          ASSET: ${{ matrix.asset }}
          SETUP_ASSET: ${{ matrix.setup }}
        run: |
          mkdir -p out
          7z a "out/$ASSET" ./launcher/target/release/horizon-launcher.exe
          cp launcher/target/release/horizon-launcher.exe "out/$SETUP_ASSET"
      - name: Package macOS app and installer
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MAC_ARCH: ${{ matrix.arch }}
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install dmgbuild==1.6.5
          binary=launcher/target/release/horizon-launcher
          [[ -z "$BUILD_TARGET" ]] || binary="launcher/target/$BUILD_TARGET/release/horizon-launcher"
          DMGBUILD="$RUNNER_TEMP/dmg/bin/dmgbuild" packaging/macos/package.sh "$binary" "$VERSION" out "$MAC_ARCH"
          rm -rf out/Zenith.app
      - uses: actions/upload-artifact@v7
        with:
          name: fork-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
      (needs.build.result == 'success' || (inputs.recovery_run && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: fork-*
          merge-multiple: true
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery_run || github.run_id }}
      - name: Check recovered launcher version
        if: inputs.recovery_run != ''
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          scratch=$(mktemp -d)
          tar -xzf dist/zenith-launcher-linux-x86_64.tar.gz -C "$scratch" horizon-launcher
          export HORIZON_HOME="$scratch/game" HORIZON_LAUNCHER_HOME="$scratch/launcher"
          export XDG_DATA_HOME="$scratch/data" XDG_CONFIG_HOME="$scratch/config"
          export HORIZON_LAUNCHER_NO_SELF_UPDATE=1 HORIZON_NO_AUDIO=1
          export HORIZON_LAUNCHER_TRASH="$scratch/trash" HORIZON_LAUNCHER_CLIPBOARD="$scratch/clipboard"
          export HORIZON_LAUNCHER_DESKTOP="$scratch/desktop"
          [[ "$("$scratch/horizon-launcher" --version)" == "horizon-launcher $RELEASE_VERSION" ]]
      - name: Sign release checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.FORK_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          bash tools/ci/sign_release.sh "$RELEASE_TAG" dist/*
          test -s dist/SHA256SUMS.sig
      - name: Verify signature against the app's public key
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          python3 - <<'PY'
          import base64, pathlib
          key = next(line.strip() for line in pathlib.Path('launcher/release-keys.txt').read_text().splitlines() if line.strip() and not line.startswith('#'))
          pathlib.Path('release-public.der').write_bytes(bytes.fromhex('302a300506032b6570032100') + base64.b64decode(key))
          signature = pathlib.Path('dist/SHA256SUMS.sig').read_text().splitlines()[0]
          pathlib.Path('release-signature.bin').write_bytes(base64.b64decode(signature))
          PY
          { printf 'horizon release %s\n' "$RELEASE_TAG"; cat dist/SHA256SUMS; } > release-message
          openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey release-public.der -in release-message -sigfile release-signature.bin
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Retain verified checksums for release recovery
        uses: actions/upload-artifact@v7
        with:
          name: zenith-launcher-signed-checksums
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          if-no-files-found: error
          overwrite: true
      - name: Publish immutable launcher release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          cat > release-notes.md <<'NOTES'
          Offline accounts, custom local skins, self-hosted offline servers, and owner-managed port-forwarding invitations.

          Future launcher updates install from inside the app. Archives are verified with this fork's Ed25519 signing key. Missing game files download automatically for offline profiles; existing installations are reused. No game files are bundled.

          See FORK.md in the repository for setup and hosting instructions. PNG skins render locally; they are not distributed to other clients.
          NOTES
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Zenith ${RELEASE_TAG#launcher@}" --notes-file release-notes.md --latest
