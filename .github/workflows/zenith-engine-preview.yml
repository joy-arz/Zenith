name: Zenith engine preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version in the form X.Y.Z-preview.N
        required: true
        default: 0.2.0-preview.1
      source_commit:
        description: Optional exact commit SHA for an artifact-only rebuild
        type: string
        default: ''
      publish_preview:
        description: Publish the verified archives as a private GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

env:
  HORIZON_VERSION: ${{ inputs.version }}
  ZENITH_RUST_EDITION: "1"
  HORIZON_TELEMETRY_URL: 'off'
  CARGO_INCREMENTAL: '0'
  ZENITH_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}

jobs:
  build:
    if: github.repository == 'joy-arz/zenith-rust-edition' || github.repository == 'joy-arz/Zenith'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x64
            exe: .exe
          - os: windows-11-vs2026-arm
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
            exe: .exe
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    env:
      BUILD_TARGET: ${{ matrix.target }}
      OUTPUT: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}fast
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.ZENITH_SOURCE_COMMIT }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure the Windows ARM64 LLVM assembler
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Get-Command clang -ErrorAction SilentlyContinue) -and (Test-Path (Join-Path $llvmBin 'clang.exe'))) {
            "$llvmBin" >> $env:GITHUB_PATH
          }
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Validate version and build the game
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZENITH_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$ZENITH_SOURCE_COMMIT" ]]
          [[ "$HORIZON_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.[1-9][0-9]*$ ]]
          python3 tools/check_public_tree.py
          if [[ "$RUNNER_OS" == Windows ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --profile fast --locked ${BUILD_TARGET:+--target "$BUILD_TARGET"} -p horizon-official -p horizon-client-lib \
            -p horizon-prepare -p horizon-server \
            --bin horizon-official --bin horizon-ctl --bin horizon-prepare --bin horizon-server
      - name: Package and check the client
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          folder="zenith-$PLATFORM"
          cp -f "$OUTPUT/horizon-official$EXE" "$OUTPUT/horizon-client$EXE"
          cargo run --locked -p xtask -- package-source "$OUTPUT/horizon-client$EXE" "dist/$folder"
          [[ "$("dist/$folder/horizon-client$EXE" --help)" == *--resources* ]]
          [[ "$("dist/$folder/horizon-client$EXE" --version)" == "Zenith Rust Edition $HORIZON_VERSION" ]]
          [[ "$("dist/$folder/horizon-prepare$EXE" --version)" == *"$HORIZON_VERSION"* ]]
          (cd dist && tar -czf "$folder.tar.gz" "$folder")
      - name: Package and check the Linux server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --profile fast --locked -p horizon-client --no-default-features --bin horizon-client
          folder=zenith-server-linux-x86_64
          cargo run --locked -p xtask -- package-server-source "$OUTPUT/horizon-client" "dist/$folder"
          [[ "$("dist/$folder/horizon-server" --version)" == "horizon-server $HORIZON_VERSION" ]]
          (cd dist && tar -czf "$folder.tar.gz" "$folder")
      - uses: actions/upload-artifact@v7
        with:
          name: zenith-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.ZENITH_SOURCE_COMMIT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          pattern: zenith-*
          path: dist
          merge-multiple: true
      - name: Record the exact source and verify preview signatures
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZENITH_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$ZENITH_SOURCE_COMMIT" ]]
          tag="zenith-game@$HORIZON_VERSION"
          git archive --format=tar.gz --output=dist/zenith-source.tar.gz HEAD
          upstream=$(cat packaging/zenith-engine-upstream.txt)
          mixins=$(sed -nE 's/^pub const MIXINS_REV: &str = "([0-9a-f]{40})";$/\1/p' launcher/src/native_mods.rs)
          protocol=$(sed -nE 's/^pub const PROTOCOL_VERSION: i32 = ([0-9]+);$/\1/p' crates/horizon-core/src/version.rs)
          vanilla=$(sed -nE 's/^pub const VANILLA_VERSION: &str = "([^"]+)";$/\1/p' crates/horizon-core/src/version.rs)
          [[ "$upstream" =~ ^[0-9a-f]{40}$ && "$mixins" =~ ^[0-9a-f]{40}$ && -n "$protocol" && -n "$vanilla" ]]
          jq -n --arg commit "$ZENITH_SOURCE_COMMIT" --arg tag "$tag" --arg version "$HORIZON_VERSION" \
            --arg upstream "$upstream" --arg mixins "$mixins" --arg minecraft "$vanilla" --argjson protocol "$protocol" \
            '{source_commit:$commit,tag:$tag,version:$version,channel:"preview",upstream_commit:$upstream,
              mixins_commit:$mixins,minecraft_compatibility:$minecraft,protocol:$protocol}' > dist/preview.json
          EPHEMERAL=yes bash tools/ci/sign_release.sh "$tag" dist/*.tar.gz dist/preview.json
          cargo run --locked --quiet -p horizon-release-sign -- verify \
            --tag "$tag" --key "$(cat dist/ephemeral.pub)" dist
      - uses: actions/upload-artifact@v7
        with:
          name: zenith-preview-verification
          path: |
            dist/preview.json
            dist/zenith-source.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/ephemeral.pub
          if-no-files-found: error

  publish:
    environment: zenith-engine-release
    if: >-
      inputs.publish_preview && !inputs.source_commit && github.repository == 'joy-arz/zenith-rust-edition'
      && github.event.repository.private && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: zenith-*
          path: dist
          merge-multiple: true
      - name: Sign the verified checksums for Zenith Launcher
        env:
          ZENITH_ENGINE_SIGNING_KEY: ${{ secrets.ZENITH_ENGINE_SIGNING_KEY }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          bash tools/ci/sign_zenith_checksums.sh "zenith-game@$HORIZON_VERSION" dist launcher/zenith-engine-release-keys.txt
      - name: Publish the verified preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="zenith-game@$HORIZON_VERSION"
          jq -e --arg tag "$tag" --arg commit "$GITHUB_SHA" \
            '.tag == $tag and .source_commit == $commit and .channel == "preview"' dist/preview.json
          (cd dist && sha256sum --check SHA256SUMS)
          api="repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          ref=$(gh api "$api" --jq '.[] | select(.ref == "refs/tags/'"$tag"'") | .object.sha')
          if [[ -z "$ref" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          else
            [[ "$ref" == "$GITHUB_SHA" ]]
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Zenith Rust Edition $HORIZON_VERSION" --notes-file packaging/ZENITH-PREVIEW.txt \
            dist/*.tar.gz dist/preview.json dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.zenith.sig dist/ephemeral.pub
